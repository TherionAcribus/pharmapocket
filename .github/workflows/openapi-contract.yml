name: OpenAPI contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generated-types:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: schema-ci-only
      DATABASE_URL: sqlite:///:memory:
      DJANGO_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate and validate OpenAPI schema
        run: >-
          python backend/manage.py spectacular
          --urlconf pharmapocket.schema_urls
          --file openapi/schema.yaml
          --validate
          --fail-on-warn

      - name: Check generated TypeScript types
        working-directory: frontend
        run: npm run types:check

      - name: Check committed schema
        run: git diff --exit-code -- openapi/schema.yaml
