              $ref: '#/components/schemas/AdminTaxonomyNodeCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTaxonomyNode'
          description: ''
