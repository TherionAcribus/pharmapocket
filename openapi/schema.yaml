      parameters:
      - in: query
        name: maladies_nodes
        schema:
          type: string
      - in: query
        name: medicament_nodes
        schema:
          type: string
      - in: query
        name: pharmacologie_nodes
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: recent
        schema:
          type: boolean
      - in: query
        name: tags
        schema:
          type: string
      - in: query
        name: theme_nodes
        schema:
          type: string
      tags:
      - content
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
