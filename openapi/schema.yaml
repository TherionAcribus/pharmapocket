  /api/v1/content/admin/microarticles/import/:
    post:
      operationId: admin_card_import
      description: |-
        Crée des fiches à partir du JSON décrit dans `docs/prompt_generation_cartes.md`.

        L'import est tout-ou-rien : une seule carte en erreur annule le lot, et le
        rapport détaille carte par carte ce qu'il faut corriger. `dry_run` rejoue
        exactement le même chemin puis annule la transaction.
      tags:
      - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCardImport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCardImport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCardImport'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCardImportReport'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCardImportReport'
          description: ''
  /api/v1/content/admin/microarticles/search/:
    get:
