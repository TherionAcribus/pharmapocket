openapi: 3.0.3
info:
  title: PharmaPocket API
  version: 1.0.0
  description: Contrat de l'API v1 consommée par le frontend PharmaPocket.
paths:
  /api/v1/auth/account/:
    get:
      operationId: auth_account
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
          description: ''
    patch:
      operationId: auth_account_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
