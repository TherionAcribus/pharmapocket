components:
  schemas:
    AccountSummary:
      type: object
      properties:
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        username:
          type: string
        pseudo:
          type: string
        has_usable_password:
          type: boolean
      required:
      - email
      - has_usable_password
      - pseudo
      - username
    ActionEnum:
      enum:
      - created
      - updated
      type: string
      description: |-
        * `created` - created
        * `updated` - updated
    AdminCardImport:
      type: object
      description: |-
        POST /admin/microarticles/import/

        Seule l'enveloppe est validée ici : la forme d'une carte est trop imbriquée
        pour un serializer plat, et `content.importers` doit renvoyer *toutes* les
        erreurs d'un coup plutôt que la première. `cards` accepte une carte seule
        autant qu'une liste, parce qu'un LLM produit indifféremment l'une ou l'autre.
      properties:
        cards: {}
        publish:
          type: boolean
          default: false
        dry_run:
          type: boolean
          default: false
        create_sources:
          type: boolean
          default: true
        on_existing:
          allOf:
          - $ref: '#/components/schemas/OnExistingEnum'
          default: error
          description: |-
            `update` réécrit la fiche portant le même slug.

            * `error` - error
            * `update` - update
      required:
      - cards
    AdminCardImportReport:
      type: object
      properties:
        ok:
          type: boolean
        dry_run:
          type: boolean
        published:
          type: boolean
        imported:
          type: integer
        updated:
          type: integer
        detail:
          type: string
        unknown_categories:
          type: array
          items:
            $ref: '#/components/schemas/UnknownCategory'
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminCardImportResult'
      required:
      - dry_run
      - ok
      - results
      - unknown_categories
    AdminCardImportResult:
      type: object
      description: Résultat d'une carte du lot ; `ok=False` porte les erreurs à corriger.
      properties:
        index:
          type: integer
        ok:
          type: boolean
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        card_type:
          type: string
        status:
          type: string
        action:
          $ref: '#/components/schemas/ActionEnum'
        subject:
          type: string
          nullable: true
        created_subject:
          type: boolean
        created_sources:
          type: array
          items:
            type: string
        created_tags:
          type: array
          items:
            type: string
        created_questions:
          type: integer
        reused_questions:
          type: integer
        tags:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        unknown_categories:
          type: array
          items:
            $ref: '#/components/schemas/UnknownCategory'
      required:
      - errors
      - index
      - ok
      - warnings
    AdminImageUpload:
      type: object
      description: |-
        POST /admin/images/upload/ — le fichier arrive sous `file` ou `image`.

        `validated_data` expose `file` (l'upload validé) et `title` (celui fourni,
        sinon le nom du fichier).
      properties:
        file:
          type: string
          format: binary
        image:
          type: string
          format: binary
        title:
          type: string
          nullable: true
    AdminMicroArticleSearchResult:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        packs_count:
          type: integer
          minimum: 0
      required:
      - id
      - packs_count
      - slug
      - title
    AdminPackBulkAdd:
      type: object
      description: |-
        POST /admin/packs/<id>/bulk-add/.

        Trois formes d'entrée, dans cet ordre de priorité : `items` (texte collé),
        `microarticle_ids` puis `slugs`. Toutes se ramènent à
        `validated_data["tokens"]`, une liste de jetons id-ou-slug que la vue résout.
      properties:
        items:
          type: string
        microarticle_ids:
          type: array
          items:
            type: string
        slugs:
          type: array
          items:
            type: string
    AdminPackCreate:
      type: object
      description: POST /admin/packs/ — `sort_order` absent ou nul = à la suite des
        packs existants.
      properties:
        name:
          type: string
          maxLength: 60
        description:
          type: string
          nullable: true
        difficulty:
          type: string
          nullable: true
          maxLength: 16
        estimated_minutes:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        status:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/StatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        cover_image_id:
          type: integer
          nullable: true
        sort_order:
          type: integer
          nullable: true
      required:
      - name
    AdminPackDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        difficulty:
          type: string
        estimated_minutes:
          type: integer
          nullable: true
        status:
          type: string
        type:
          type: string
        sort_order:
          type: integer
        cards_count:
          type: integer
          minimum: 0
        cover_image_url:
          type: string
          nullable: true
        cover_image_credit:
          type: string
          nullable: true
        cover_image:
          allOf:
          - $ref: '#/components/schemas/ImagePayload'
          nullable: true
        cards:
          type: array
          items:
            $ref: '#/components/schemas/DeckCardItem'
      required:
      - cards
      - cards_count
      - cover_image_url
      - description
      - difficulty
      - estimated_minutes
      - id
      - name
      - sort_order
      - status
      - type
    AdminPackReorder:
      type: object
      description: POST /admin/packs/<id>/cards/reorder/
      properties:
        microarticle_ids:
          type: array
          items:
            type: integer
      required:
      - microarticle_ids
    AdminPackSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        difficulty:
          type: string
        estimated_minutes:
          type: integer
          nullable: true
        status:
          type: string
        type:
          type: string
        sort_order:
          type: integer
        cards_count:
          type: integer
          minimum: 0
        cover_image_url:
          type: string
          nullable: true
        cover_image_credit:
          type: string
          nullable: true
        cover_image:
          allOf:
          - $ref: '#/components/schemas/ImagePayload'
          nullable: true
      required:
      - cover_image_url
      - description
      - difficulty
      - estimated_minutes
      - id
      - name
      - sort_order
      - status
      - type
    AdminTaxonomyNode:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        depth:
          type: integer
        parent_id:
          type: integer
          nullable: true
        taxonomy:
          type: string
      required:
      - depth
      - id
      - name
      - parent_id
      - slug
      - taxonomy
    AdminTaxonomyNodeCreate:
      type: object
      description: |-
        POST /admin/taxonomies/<taxonomy>/nodes/ — `context["model"]` porte la taxonomie.

        Le slug est dérivé du nom quand il n'est pas fourni, comme dans le formulaire
        Wagtail ; l'unicité est vérifiée ici pour renvoyer un 400 lisible plutôt
        qu'une erreur d'intégrité.
      properties:
        name:
          type: string
          maxLength: 120
        slug:
          type: string
        parent_id:
          type: integer
          nullable: true
      required:
      - name
    AdminThumbOverride:
      type: object
      properties:
        pathology_slug:
          type: string
        bg:
          type: string
        accent:
          type: string
        pattern:
          type: string
        id:
          type: integer
        updated_at:
          type: string
          format: date-time
      required:
      - accent
      - bg
      - id
      - pathology_slug
      - pattern
      - updated_at
    BulkAddResponse:
      type: object
      properties:
        added:
          type: integer
          minimum: 0
        already_present:
          type: integer
          minimum: 0
        not_found:
          type: integer
          minimum: 0
      required:
      - added
      - already_present
    CardDecksUpdate:
      type: object
      description: PUT /cards/<id>/decks/
