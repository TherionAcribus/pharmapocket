  /api/v1/content/admin/taxonomies/{taxonomy}/nodes/:
    post:
      operationId: admin_taxonomy_node_create
      description: |-
        POST /admin/taxonomies/<taxonomy>/nodes/ — crée une catégorie.

        Treebeard exige `add_root()` / `parent.add_child()` pour allouer le chemin :
        c'est la seule façon de créer un nœud, `save()` direct est refusé par le modèle.
      parameters:
      - in: path
        name: taxonomy
        schema:
          type: string
        required: true
      tags:
      - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTaxonomyNodeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminTaxonomyNodeCreate'
          multipart/form-data:
